<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Impetus</title>
<base href="../app/">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="stage"></div>
<script>
// PC preview: load index.html's stage markup, mock the TV, then the app.
// Query: t=<ISO time>  room=control|engine  notice=sleep
//        still=live|last|none|black  caps=<names to switch off, comma separated>
//        scene=<id> (a scene already on)  shield=on
(function () {
  var q = location.search;
  function arg(name) { var m = new RegExp("[?&]" + name + "=([^&]*)").exec(q); return m ? decodeURIComponent(m[1]) : ""; }
  if (arg("t")) { var fixed = new Date(arg("t")).getTime(), base = Date.now(), RD = Date;
    window.Date = function (a, b, c, d, e, f, g) { if (arguments.length === 0) return new RD(fixed + (RD.now() - base)); return arguments.length === 1 ? new RD(a) : new RD(a, b, c || 1, d || 0, e || 0, f || 0, g || 0); };
    window.Date.now = function () { return fixed + (RD.now() - base); }; window.Date.prototype = RD.prototype; }
  function nowS() { return Math.round(Date.now() / 1000); }

  var off = arg("caps").split(",");
  var tv = { scene: arg("scene"), end: "", sleep: "", screenoff: "", shield: arg("shield") === "on", hits: 1204 };
  if (tv.scene === "film") tv.end = nowS() + 12 * 3600;
  if (tv.scene === "winddown") tv.sleep = nowS() + 47 * 60;

  function stateText() {
    if (tv.shield) tv.hits += Math.floor(Math.random() * 3);
    return ["now=" + nowS(), "scene=" + tv.scene, "target=", "end=" + tv.end, "sleep=" + tv.sleep,
      "screenoff=" + tv.screenoff, "shield=" + (tv.shield ? "on" : "off")].concat(tv.shield ? ["hits=" + tv.hits] : [])
      .concat(["hosts=45", "keeper=1"]).join("\n");
  }
  var talk = [["142.250.74.46", "WebAppMgr", 6], ["142.250.74.78", "WebAppMgr", 3], ["52.94.236.248", "amazon", 2],
    ["18.66.112.9", "lgecloud", 4], ["34.120.5.11", "rdxd", 2], ["3.248.12.1", "netflix", 5], ["104.18.32.7", "WebAppMgr", 1],
    ["17.253.144.10", "airplayd", 2], ["192.168.1.20", "ssdpd", 1], ["35.186.224.25", "spotify", 3], ["91.198.174.192", "WebAppMgr", 1]];
  window.MOCK_HOSTS = { "142.250.74.46": "arn09s23-in-f14.1e100.net", "142.250.74.78": "arn11s04-in-f14.1e100.net",
    "52.94.236.248": "fls-eu.amazon.com", "18.66.112.9": "snu.lge.com", "34.120.5.11": "eic.rdx2.lgtvsdp.com",
    "3.248.12.1": "ichnaea.netflix.com", "17.253.144.10": "gs-loc.apple.com", "35.186.224.25": "ap-gew4.spotify.com",
    "104.18.32.7": "cdn.cloudflare.net" };
  function netstat() {
    var out = [];
    talk.forEach(function (r) { for (var i = 0; i < r[2]; i++) out.push("tcp 0 0 192.168.1.50:5" + (1000 + out.length) + " " + r[0] + ":443 ESTABLISHED " + (500 + out.length) + "/" + r[1]); });
    return out.join("\n");
  }
  var log = [
    "2026-11-14T21:02:41.120394Z [5521.100] user.info sam [] SAM APP_LAUNCH {\"app_id\":\"netflix\"} launched",
    "2026-11-14T21:02:44.501221Z [5524.481] user.info WebAppMgr [] WAM page loaded url=https://www.netflix.com/tv",
    "2026-11-14T21:03:02.000184Z [5541.980] user.warning nyx-utils [] device_id=A1B2C3D4E5F60718 mac_addr=AA:BB:CC:DD:EE:FF reported",
    "2026-11-14T21:03:10.778120Z [5550.758] user.info connman [] wlan0 {192.168.1.50} lease renewed",
    "2026-11-14T21:03:15.330001Z [5555.310] user.info audiod [] volume changed 14 -> 12",
    "2026-11-14T21:03:21.640920Z [5561.620] user.info tvpowerd [] power state Active",
    "2026-11-14T21:03:30.118742Z [5570.098] user.info luna-send [] impetus poll",
    "2026-11-14T21:03:33.902117Z [5573.882] user.info settingsservice [] picture backlight 80 -> 30 (hdmi2)",
    "2026-11-14T21:03:40.004410Z [5579.984] user.err rdxd [] upload failed host=eic.rdx2.lgtvsdp.com session 0f3c9a7be21d4c55aa01"
  ].join("\n");

  window.MOCK_CTL = function (w) {
    var verb = w[0];
    if (verb === "probe") {
      if (off.indexOf("exec") >= 0) throw new Error("no exec");
      return ["exec", "capture", "picture", "screenoff", "sleep", "volume", "shield", "count", "log", "temp"]
        .map(function (k) { return k + "=" + (off.indexOf(k) >= 0 ? 0 : 1); }).join("\n");
    }
    if (verb === "state") return stateText();
    if (verb === "scene" && w[1] === "on") {
      tv.scene = ""; tv.end = tv.sleep = tv.screenoff = "";
      w.slice(2).forEach(function (a) {
        var k = a.split("=")[0], v = a.slice(k.length + 1);
        if (k === "id") tv.scene = v;
        if (k === "end") tv.end = v;
        if (k === "sleep") tv.sleep = nowS() + Number(v) * 60;
        if (k === "screenoff") tv.screenoff = nowS() + Number(v);
      });
      console.log("ctl", w.join(" "));
      return "ok=1";
    }
    if (verb === "scene") { tv.scene = ""; tv.end = tv.sleep = tv.screenoff = ""; return "ok=1"; }
    if (verb === "sleep") { tv.sleep = ""; return "prev=netflix"; }
    if (verb === "shield") { tv.shield = w[1] === "on"; tv.hits = 0; return "ok=1"; }
    if (verb === "engine") {
      return ["@vitals", "temp=" + (46000 + Math.floor(Math.random() * 3000)), "uptime=" + (93784 + (nowS() % 1000)),
        "memtotal=1543168", "memavail=" + (612000 + Math.floor(Math.random() * 20000)), "disktotal=1048576", "diskused=412300",
        "@state", stateText(), "@talk", netstat(), "@log", log].join("\n");
    }
    return "ok=1";
  };

  // A stand-in frame: something that reads as a film still.
  var frame = null;
  function makeFrame(black) {
    var c = document.createElement("canvas"); c.width = 480; c.height = 270;
    var g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, 480, 270);
    if (!black) {
      var sky = g.createLinearGradient(0, 0, 0, 270);
      sky.addColorStop(0, "#1b2a4a"); sky.addColorStop(0.55, "#b5562f"); sky.addColorStop(1, "#1a0f0c");
      g.fillStyle = sky; g.fillRect(0, 0, 480, 270);
      g.fillStyle = "#f3c27a"; g.beginPath(); g.arc(330, 150, 34, 0, 7); g.fill();
      g.fillStyle = "#0c0a0a"; g.beginPath(); g.moveTo(0, 270); g.lineTo(0, 190); g.lineTo(120, 130); g.lineTo(210, 185);
      g.lineTo(300, 160); g.lineTo(480, 215); g.lineTo(480, 270); g.fill();
    }
    return c.toDataURL("image/jpeg", 0.8);
  }
  window.MOCK_STILL = function (nolive) {
    var mode = arg("still") || "last";
    if (mode === "none") return { kind: "none", age: 0, src: null };
    if (!nolive && mode === "live") return { kind: "live", age: 0, src: frame || (frame = makeFrame(false)) };
    if (!nolive && mode === "black") return { kind: "live", age: 0, src: makeFrame(true) };
    return { kind: "last", age: 720, src: frame || (frame = makeFrame(false)) };
  };

  var x = new XMLHttpRequest(); x.open("GET", "index.html", false); x.send();
  var m = /<div id="stage">([\s\S]*?)<\/div>\s*<script/.exec(x.responseText);
  document.getElementById("stage").innerHTML = m[1];
  ["../preview/mock-apps.js", "logic.js", "config.js", "luna.js", "home.js"].forEach(function (s) {
    var e = document.createElement("script"); e.src = s; e.async = false; document.body.appendChild(e);
  });
})();
</script>
</body>
</html>
