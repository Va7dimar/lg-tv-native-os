<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Impetus</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="stage">

  <!-- Room 1: the living room -->
  <main id="living" class="room living">
    <span class="light"></span>
    <svg id="sky" class="sky" width="1920" height="1080" viewBox="0 0 1920 1080">
      <defs>
        <radialGradient id="halo">
          <stop offset="0" stop-color="#1FB487" stop-opacity="0.55"/>
          <stop offset="0.35" stop-color="#2C8C86" stop-opacity="0.22"/>
          <stop offset="1" stop-color="#2C8C86" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="above"><rect x="0" y="0" width="1920" height="690"/></clipPath>
      </defs>
      <g clip-path="url(#above)">
        <path id="arc" class="arc" d=""/>
        <path id="travelled" class="travelled" d=""/>
        <circle id="glow" r="150" fill="url(#halo)"/>
        <circle id="sun" class="sun" r="11"/>
      </g>
      <line class="horizon" x1="0" y1="691" x2="1920" y2="691"/>
    </svg>
    <section class="ground">
      <time id="clock" class="clock">--:--</time>
      <p id="date" class="date"></p>
      <p id="sunline" class="sunline"></p>
    </section>
  </main>

  <!-- Room 2: the control room, turned over the living room on any key -->
  <section id="control" class="room control" aria-hidden="true">
    <span class="lead"></span>

    <section class="col-main">
      <button id="appletv" class="key appletv" data-focus>
        <img id="still" class="still" alt="" hidden>
        <span class="shade"></span>
        <span id="stillage" class="stillage"></span>
        <span class="name">APPLE TV</span>
      </button>
      <h2 class="label">SHORTCUTS</h2>
      <nav id="shortcuts" class="shortcuts"></nav>
    </section>

    <section class="col-apps">
      <h2 class="label">APPS</h2>
      <nav id="apps" class="apps"></nav>
      <p id="note" class="note" hidden></p>
    </section>

    <section class="col-scenes">
      <h2 id="sceneslabel" class="label" hidden>SCENES</h2>
      <nav id="scenes" class="scenes"></nav>
      <p id="shieldline" class="shieldline" hidden><span class="what">SHIELD</span><span id="shieldcount" class="n">OFF</span></p>
      <button id="door" class="key door" data-focus hidden>ENGINE ROOM</button>
    </section>
  </section>

  <!-- Room 3: the engine room, behind the door in the control room -->
  <section id="engine" class="room engine" aria-hidden="true">
    <span class="lead"></span>

    <section class="slab vitals">
      <h2 class="label">VITALS</h2>
      <p class="temp"><span id="temp">–</span><span class="unit">°C</span></p>
      <p class="row"><span class="what">UPTIME</span><span id="uptime" class="n">–</span></p>
      <p class="row"><span class="what">MEMORY</span><span id="memtext" class="n">–</span></p>
      <p class="meter"><span id="membar"></span></p>
      <p class="row"><span class="what">STORAGE</span><span id="disktext" class="n">–</span></p>
      <p class="meter"><span id="diskbar"></span></p>
    </section>

    <button id="shield" class="key shieldkey" data-focus hidden>
      <span class="name">SHIELD</span>
      <span id="shieldstate" class="state">OFF</span>
      <span id="shielddoes" class="does"></span>
    </button>

    <section class="slab talkers">
      <h2 class="label">WHO TALKS THE MOST</h2>
      <p id="talktotal" class="count">–</p>
      <p class="sub">open connections</p>
      <ol id="talklist" class="talklist"></ol>
    </section>

    <section class="slab log">
      <h2 class="label">LOG</h2>
      <ol id="loglist" class="loglist"></ol>
    </section>
  </section>

  <!-- The sleep notice: two minutes before standby, any key cancels -->
  <section id="notice" class="room notice" aria-hidden="true">
    <h2 class="label">STANDBY IN</h2>
    <p id="countdown" class="countdown">2:00</p>
    <p class="noticeline">Press any key to stay up.</p>
  </section>

</div>
<script src="logic.js"></script>
<script src="config.js"></script>
<script src="luna.js"></script>
<script src="home.js"></script>
</body>
</html>
